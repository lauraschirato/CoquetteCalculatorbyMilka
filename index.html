<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coquette Calculator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>
    <div class="floating-elements">
        <div class="float-el">🍓</div>
        <div class="float-el">✨</div>
        <div class="float-el">🌸</div>
        <div class="float-el">🍓</div>
        <div class="float-el">✨</div>
        <div class="float-el">🎀</div>
        <div class="float-el">🍓</div>
    </div>
    <div class="calculator">
        <div class="strawberry">🍓</div>
        <div class="display">
            <div class="previous-operand" data-previous-operand></div>
            <div class="current-operand" data-current-operand></div>
        </div>
        <button data-all-clear class="span-two clear-btn"><span class="material-icons">delete_sweep</span></button>
        <button data-delete class="del-btn"><span class="material-icons">backspace</span></button>
        <button data-operation class="op-btn">÷</button>
        <button data-number>7</button>
        <button data-number>8</button>
        <button data-number>9</button>
        <button data-operation class="op-btn">×</button>
        <button data-number>4</button>
        <button data-number>5</button>
        <button data-number>6</button>
        <button data-operation class="op-btn">-</button>
        <button data-number>1</button>
        <button data-number>2</button>
        <button data-number>3</button>
        <button data-operation class="op-btn">+</button>
        <button data-number class="zero-btn">0</button>
        <button data-number>.</button>
        <button data-equals class="span-two equal-btn">=</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
